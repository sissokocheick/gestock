services:
  - type: web
    name: gestion-stock-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-stock-db
          property: connectionString

databases:
  - name: gestion-stock-db
    plan: free
    databaseName: gestion_stock
